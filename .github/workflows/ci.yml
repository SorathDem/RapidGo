name: CI RapidGo
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar Airflow (para validar el DAG)
        run: |
          pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests airflow scripts
      - name: Validar importacion del DAG
        env:
          PYTHONPATH: ${{ github.workspace }}/airflow/dags
        run: |
          python -c "from airflow.models import DagBag; d = DagBag('airflow/dags', include_examples=False); assert not d.import_errors, d.import_errors; print('DAG OK:', list(d.dags))"
      - name: Ejecutar pruebas
        run: pytest -v
      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Quality Gate - documentación obligatoria
        run: |
          for f in README.md docs/arquitectura.png docs/checkpoints/semana1.md docs/checkpoints/semana2.md docs/checkpoints/semana3.md; do
            [ -f "$f" ] || { echo "::error::Falta $f"; exit 1; }
          done
          for n in 1 2 3; do
            ls docs/decisions/ADR-00$n-*.md >/dev/null 2>&1 || { echo "::error::Falta ADR-00$n"; exit 1; }
          done
          if grep -rn "«COMPLETAR" README.md docs/checkpoints docs/decisions; then
            echo "::error::Quedan marcadores COMPLETAR sin resolver"; exit 1
          fi
      - name: Empaquetar artefacto
        run: git archive --format=zip -o rapidgo-flota.zip HEAD
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rapidgo-flota
          path: rapidgo-flota.zip
